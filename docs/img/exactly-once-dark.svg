<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="t d"><title id="t">Why a lost CRM response never creates a duplicate booking</title><desc id="d">Sequence between worker, database outbox and CRM across a lost reply and a retry.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0883e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#46b565"/></marker></defs><rect width="1280" height="700" fill="#0d1117"/><text x="48" y="56" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="750" fill="#e6edf3" text-anchor="start">Exactly-once delivery to an unreliable CRM</text><text x="48" y="82" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18.2" font-weight="400" fill="#9198a1" text-anchor="start">The CRM committed the booking but the reply never arrived. The worker cannot know, so it asks before it writes again.</text><rect x="110" y="112" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="200" y="138" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18.2" font-weight="650" fill="#e6edf3" text-anchor="middle">Worker</text><line x1="200" y1="156" x2="200" y2="660" stroke="#30363d" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="550" y="112" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="640" y="138" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18.2" font-weight="650" fill="#e6edf3" text-anchor="middle">PostgreSQL outbox</text><line x1="640" y1="156" x2="640" y2="660" stroke="#30363d" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="990" y="112" width="180" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="1080" y="138" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18.2" font-weight="650" fill="#e6edf3" text-anchor="middle">CRM</text><line x1="1080" y1="156" x2="1080" y2="660" stroke="#30363d" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="200" y1="196" x2="640" y2="196" stroke="#79a6e8" stroke-width="1.6" marker-end="url(#a)"/><text x="420.0" y="187" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="600" fill="#e6edf3" text-anchor="middle">INSERT outbox (key K)</text><text x="420.0" y="214" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#9198a1" text-anchor="middle">same transaction as the step's output</text><circle cx="178" cy="196" r="11" fill="#79a6e8"/><text x="178" y="200" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="700" fill="#161b22" text-anchor="middle">1</text><line x1="200" y1="262" x2="1080" y2="262" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><text x="640.0" y="253" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="600" fill="#e6edf3" text-anchor="middle">GET /bookings</text><text x="640.0" y="280" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#9198a1" text-anchor="middle">not there yet: safe to create</text><circle cx="178" cy="262" r="11" fill="#9198a1"/><text x="178" y="266" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="700" fill="#161b22" text-anchor="middle">2</text><line x1="200" y1="328" x2="1080" y2="328" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><text x="640.0" y="319" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="600" fill="#e6edf3" text-anchor="middle">POST /bookings  Idempotency-Key: K</text><circle cx="178" cy="328" r="11" fill="#9198a1"/><text x="178" y="332" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="700" fill="#161b22" text-anchor="middle">3</text><text x="1080" y="356" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.6" font-weight="650" fill="#46b565" text-anchor="middle">booking committed</text><line x1="1080" y1="404" x2="200" y2="404" stroke="#f0883e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ac)"/><text x="640.0" y="395" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="600" fill="#e6edf3" text-anchor="middle">no reply (connection dropped, or worker killed)</text><circle cx="178" cy="404" r="11" fill="#f0883e"/><text x="178" y="408" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="700" fill="#161b22" text-anchor="middle">4</text><line x1="200" y1="470" x2="1080" y2="470" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><text x="640.0" y="461" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="600" fill="#e6edf3" text-anchor="middle">GET /bookings</text><text x="640.0" y="488" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#9198a1" text-anchor="middle">the next attempt reconciles before it writes</text><circle cx="178" cy="470" r="11" fill="#9198a1"/><text x="178" y="474" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="700" fill="#161b22" text-anchor="middle">5</text><line x1="1080" y1="536" x2="200" y2="536" stroke="#46b565" stroke-width="1.6" marker-end="url(#ao)"/><text x="640.0" y="527" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="600" fill="#e6edf3" text-anchor="middle">booking found for this call</text><circle cx="178" cy="536" r="11" fill="#46b565"/><text x="178" y="540" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="700" fill="#161b22" text-anchor="middle">6</text><line x1="200" y1="602" x2="640" y2="602" stroke="#46b565" stroke-width="1.6" marker-end="url(#ao)"/><text x="420.0" y="593" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="600" fill="#e6edf3" text-anchor="middle">mark done, adopt CRM id</text><text x="420.0" y="620" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#9198a1" text-anchor="middle">result: one booking, the retry cost nothing</text><circle cx="178" cy="602" r="11" fill="#46b565"/><text x="178" y="606" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="700" fill="#161b22" text-anchor="middle">7</text><rect x="716" y="566" width="524" height="116" rx="10" fill="#1c2230" stroke="#30363d" stroke-width="1.2"/><text x="736" y="594" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="650" fill="#e6edf3" text-anchor="start">Retry inside one attempt: same key, same body.</text><text x="736" y="618" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">The CRM replays its first answer (Idempotent-Replayed).</text><text x="736" y="646" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">Slot taken meanwhile (409): next free slot, NEW key.</text><text x="736" y="670" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">A key is never reused with a different body.</text></svg>
