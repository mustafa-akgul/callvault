<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d"><title id="t">Callvault: no call lost, no booking doubled</title><desc id="d">A call-recording pipeline that survives killed workers and a failing CRM.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F6670"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F7D4F"/></marker></defs><rect width="1280" height="420" fill="#FAF8F5"/><text x="72" y="96" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22.1" font-weight="700" fill="#C2410C" text-anchor="start">CALLVAULT</text><text x="72" y="170" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="750" fill="#1F2328" text-anchor="start">No call lost.</text><text x="72" y="232" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="750" fill="#1F2328" text-anchor="start">No booking doubled.</text><text x="72" y="274" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5F6670" text-anchor="start">Call recordings in. Masked data and CRM actions out.</text><text x="72" y="346" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="750" fill="#3B5B92" text-anchor="start">387</text><text x="72" y="376" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="400" fill="#5F6670" text-anchor="start">tests</text><text x="242" y="346" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="750" fill="#2F7D4F" text-anchor="start">0</text><text x="242" y="376" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="400" fill="#5F6670" text-anchor="start">calls lost</text><text x="412" y="346" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="750" fill="#2F7D4F" text-anchor="start">0</text><text x="412" y="376" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="400" fill="#5F6670" text-anchor="start">duplicates</text><rect x="700" y="48" width="508" height="324" rx="14" fill="#1B1F24" stroke="#1B1F24" stroke-width="1.2"/><circle cx="724" cy="72" r="6" fill="#E5534B"/><circle cx="744" cy="72" r="6" fill="#D4A72C"/><circle cx="764" cy="72" r="6" fill="#57AB5A"/><text x="800" y="78" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="400" fill="#8B949E" text-anchor="start">python -m app.cli demo-chaos</text><text x="724" y="122" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.9" font-weight="700" fill="#57AB5A" text-anchor="start">OK</text><text x="784" y="122" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.9" font-weight="400" fill="#C9D1D9" text-anchor="start">started 3 worker processes</text><text x="724" y="154" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.9" font-weight="700" fill="#E5534B" text-anchor="start">KILL</text><text x="784" y="154" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.9" font-weight="400" fill="#C9D1D9" text-anchor="start">SIGKILL worker mid-job</text><text x="724" y="186" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.9" font-weight="700" fill="#57AB5A" text-anchor="start">OK</text><text x="784" y="186" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.9" font-weight="400" fill="#C9D1D9" text-anchor="start">replacement worker starts</text><text x="784" y="218" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.9" font-weight="400" fill="#8B949E" text-anchor="start">lease expires, job reclaimed</text><text x="784" y="250" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.9" font-weight="400" fill="#8B949E" text-anchor="start">CRM: 429, 500, stalls, drops</text><rect x="720" y="280" width="468" height="76" rx="8" fill="#14281D" stroke="#2F7D4F" stroke-width="1.2"/><text x="738" y="312" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="20.8" font-weight="700" fill="#7EE2A0" text-anchor="start">verdict: 0 lost, 0 duplicates</text><text x="738" y="340" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="400" fill="#9DD9B3" text-anchor="start">4/4 bookings, 4/4 complaints</text></svg>
