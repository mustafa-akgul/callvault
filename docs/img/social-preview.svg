<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d"><title id="t">Callvault</title><desc id="d">No recording lost, no duplicate booking, tenants isolated.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F6670"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F7D4F"/></marker></defs><rect width="1280" height="640" fill="#FAF8F5"/><rect x="0" y="0" width="1280" height="12" rx="0" fill="#C2410C" stroke="#C2410C" stroke-width="1.2"/><text x="96" y="230" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="750" fill="#1F2328" text-anchor="start">Callvault</text><text x="96" y="304" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#1F2328" text-anchor="start">A call-recording pipeline that does not lose calls</text><text x="96" y="348" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="400" fill="#1F2328" text-anchor="start">and does not double-book.</text><text x="96" y="410" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F6670" text-anchor="start">PostgreSQL row-level security  /  crash-safe queue  /  exactly-once CRM delivery</text><text x="96" y="520" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="750" fill="#3B5B92" text-anchor="start">387</text><text x="96" y="552" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F6670" text-anchor="start">tests</text><text x="296" y="520" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="750" fill="#2F7D4F" text-anchor="start">0</text><text x="296" y="552" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F6670" text-anchor="start">lost</text><text x="496" y="520" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="750" fill="#2F7D4F" text-anchor="start">0</text><text x="496" y="552" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5F6670" text-anchor="start">duplicates</text></svg>
