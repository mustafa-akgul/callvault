<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-labelledby="t d"><title id="t">Callvault architecture</title><desc id="d">Ingestion, pipeline and CRM delivery layers on one PostgreSQL database with row-level security.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0883e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#46b565"/></marker></defs><rect width="1280" height="860" fill="#0d1117"/><text x="48" y="56" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="750" fill="#e6edf3" text-anchor="start">Architecture</text><text x="48" y="82" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18.2" font-weight="400" fill="#9198a1" text-anchor="start">Every arrow between steps is one database transaction: output and next state are written together.</text><rect x="40" y="96" width="1200" height="160" rx="14" fill="#1c2230" stroke="#30363d" stroke-width="1.2"/><text x="60" y="118" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="700" fill="#79a6e8" text-anchor="start">1  Ingestion</text><rect x="150" y="126" width="280" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="150" y="126" width="4" height="114" rx="2" fill="#79a6e8"/><text x="168" y="152" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#79a6e8" text-anchor="start">STEP 0</text><text x="168" y="176" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Manifest</text><text x="168" y="202" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">recordings + tenant</text><text x="168" y="224" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">idempotent re-ingest</text><line x1="434" y1="183.0" x2="466" y2="183.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="470" y="126" width="280" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="470" y="126" width="4" height="114" rx="2" fill="#79a6e8"/><text x="488" y="152" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#79a6e8" text-anchor="start">STEP 1</text><text x="488" y="176" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Deduplicate</text><text x="488" y="202" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">SHA-256 of the audio</text><text x="488" y="224" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">byte copy becomes DUPLICATE</text><line x1="754" y1="183.0" x2="786" y2="183.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="790" y="126" width="280" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="790" y="126" width="4" height="114" rx="2" fill="#79a6e8"/><text x="808" y="152" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#79a6e8" text-anchor="start">STEP 2</text><text x="808" y="176" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Validate WAV</text><text x="808" y="202" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">header vs. length, silence</text><text x="808" y="224" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">bad file fails with a reason</text><rect x="40" y="284" width="1200" height="160" rx="14" fill="#1c2230" stroke="#30363d" stroke-width="1.2"/><text x="60" y="306" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="700" fill="#79a6e8" text-anchor="start">2  Pipeline</text><rect x="150" y="314" width="280" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="150" y="314" width="4" height="114" rx="2" fill="#79a6e8"/><text x="168" y="340" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#79a6e8" text-anchor="start">QUEUE</text><text x="168" y="364" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Job queue</text><text x="168" y="390" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">FOR UPDATE SKIP LOCKED</text><text x="168" y="412" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">lease + heartbeat + fencing</text><line x1="434" y1="371.0" x2="466" y2="371.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="470" y="314" width="280" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="470" y="314" width="4" height="114" rx="2" fill="#79a6e8"/><text x="488" y="340" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#79a6e8" text-anchor="start">STEP 3</text><text x="488" y="364" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Transcribe</text><text x="488" y="390" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">one request per channel</text><text x="488" y="412" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">channel becomes speaker role</text><line x1="754" y1="371.0" x2="786" y2="371.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="790" y="314" width="280" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="790" y="314" width="4" height="114" rx="2" fill="#79a6e8"/><text x="808" y="340" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#79a6e8" text-anchor="start">STEP 4</text><text x="808" y="364" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Protect</text><text x="808" y="390" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">AES-256-GCM raw transcript</text><text x="808" y="412" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">mask TCKN, IBAN, phone, names</text><rect x="40" y="472" width="1200" height="160" rx="14" fill="#1c2230" stroke="#30363d" stroke-width="1.2"/><text x="60" y="494" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="700" fill="#46b565" text-anchor="start">3  CRM delivery</text><rect x="150" y="502" width="280" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="150" y="502" width="4" height="114" rx="2" fill="#46b565"/><text x="168" y="528" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#46b565" text-anchor="start">STEP 5</text><text x="168" y="552" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Extract</text><text x="168" y="578" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">meeting / complaint rules</text><text x="168" y="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">runs on masked text only</text><line x1="434" y1="559.0" x2="466" y2="559.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="470" y="502" width="280" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="470" y="502" width="4" height="114" rx="2" fill="#46b565"/><text x="488" y="528" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#46b565" text-anchor="start">OUTBOX</text><text x="488" y="552" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Outbox row</text><text x="488" y="578" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">derived Idempotency-Key</text><text x="488" y="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">tenant:booking:call:slot</text><line x1="754" y1="559.0" x2="786" y2="559.0" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="790" y="502" width="280" height="114" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="790" y="502" width="4" height="114" rx="2" fill="#46b565"/><text x="808" y="528" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#46b565" text-anchor="start">STEP 6</text><text x="808" y="552" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Reconcile + send</text><text x="808" y="578" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">GET first, adopt if found</text><text x="808" y="600" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">POST with jittered retry</text><rect x="1104" y="520" width="136" height="90" rx="10" fill="#2b1c12" stroke="#f0883e" stroke-width="1.2" stroke-dasharray="6 4"/><text x="1172" y="552" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#f0883e" text-anchor="middle">External CRM</text><text x="1172" y="578" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#9198a1" text-anchor="middle">429, 500, stalls,</text><text x="1172" y="598" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.0" font-weight="400" fill="#9198a1" text-anchor="middle">dropped replies</text><line x1="1074" y1="559.0" x2="1100" y2="559.0" stroke="#f0883e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ac)"/><path d="M 910 240 L 910 270 L 290 270 L 290 314" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#a)"/><path d="M 910 428 L 910 458 L 290 458 L 290 502" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#a)"/><rect x="40" y="672" width="1200" height="148" rx="14" fill="#14213a" stroke="#79a6e8" stroke-width="1.2"/><text x="60" y="702" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="700" fill="#79a6e8" text-anchor="start">PostgreSQL</text><text x="215" y="702" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17.6" font-weight="400" fill="#9198a1" text-anchor="start">single source of truth for state, jobs, transcripts, outbox and API keys</text><text x="60" y="738" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="650" fill="#e6edf3" text-anchor="start">FORCE ROW LEVEL SECURITY</text><text x="60" y="760" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.6" font-weight="400" fill="#9198a1" text-anchor="start">on every table; no tenant context is an SQL error</text><text x="650" y="738" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="650" fill="#e6edf3" text-anchor="start">3 roles</text><text x="650" y="760" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.6" font-weight="400" fill="#9198a1" text-anchor="start">owner, worker, tenant reader: none SUPERUSER, BYPASSRLS or DELETE</text><text x="60" y="782" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="650" fill="#e6edf3" text-anchor="start">Column privileges</text><text x="60" y="804" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.6" font-weight="400" fill="#9198a1" text-anchor="start">tenant reader has no grant on raw transcripts or the queue</text><text x="650" y="782" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.9" font-weight="650" fill="#e6edf3" text-anchor="start">Hashed API keys</text><text x="650" y="804" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.6" font-weight="400" fill="#9198a1" text-anchor="start">tenant comes from the key, never from a flag</text></svg>
