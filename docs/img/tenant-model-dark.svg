<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="t d"><title id="t">Tenant isolation fails closed</title><desc id="d">An API key sets the tenant context; a query without context raises an SQL error.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0883e"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#46b565"/></marker></defs><rect width="1280" height="520" fill="#0d1117"/><text x="48" y="56" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="750" fill="#e6edf3" text-anchor="start">Tenant isolation that fails closed</text><text x="48" y="82" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18.2" font-weight="400" fill="#9198a1" text-anchor="start">The tenant is derived from a hashed API key. The database refuses to answer without it.</text><rect x="48" y="120" width="280" height="140" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="48" y="120" width="4" height="140" rx="2" fill="#79a6e8"/><text x="66" y="146" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#79a6e8" text-anchor="start">REQUEST</text><text x="66" y="170" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">API key</text><text x="66" y="196" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">cv_... (shown once)</text><text x="66" y="218" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">stored as SHA-256 only</text><text x="66" y="240" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">--tenant flag is only checked</text><rect x="388" y="120" width="300" height="140" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="388" y="120" width="4" height="140" rx="2" fill="#46b565"/><text x="406" y="146" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#46b565" text-anchor="start">TRANSACTION</text><text x="406" y="170" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">Tenant context</text><text x="406" y="196" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">set for this transaction only</text><text x="406" y="218" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">role: app_user</text><text x="406" y="240" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">no context: an SQL error</text><rect x="748" y="120" width="300" height="140" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><rect x="748" y="120" width="4" height="140" rx="2" fill="#79a6e8"/><text x="766" y="146" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15.6" font-weight="700" fill="#79a6e8" text-anchor="start">POLICY</text><text x="766" y="170" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="650" fill="#e6edf3" text-anchor="start">FORCE RLS</text><text x="766" y="196" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">tenant_id must match context</text><text x="766" y="218" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">applies to the table owner too</text><text x="766" y="240" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">no BYPASSRLS anywhere</text><line x1="332" y1="190" x2="384" y2="190" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><line x1="692" y1="190" x2="744" y2="190" stroke="#9198a1" stroke-width="1.6" marker-end="url(#a)"/><rect x="48" y="300" width="560" height="170" rx="12" fill="#2b1c12" stroke="#f0883e" stroke-width="1.2"/><text x="70" y="332" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="700" fill="#f0883e" text-anchor="start">No context</text><text x="70" y="360" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.9" font-weight="400" fill="#e6edf3" text-anchor="start">SELECT * FROM transcripts;</text><text x="70" y="392" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="16.2" font-weight="400" fill="#f0883e" text-anchor="start">ERROR: tenant context is not set</text><text x="70" y="422" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">Not an empty result: a forgotten filter</text><text x="70" y="446" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="start">fails loudly instead of leaking quietly.</text><rect x="660" y="300" width="572" height="170" rx="12" fill="#11271a" stroke="#46b565" stroke-width="1.2"/><text x="682" y="332" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="700" fill="#46b565" text-anchor="start">What a tenant can and cannot read</text><text x="682" y="364" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#e6edf3" text-anchor="start">masked transcript</text><text x="1210" y="364" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="end">yes</text><text x="682" y="386" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#e6edf3" text-anchor="start">raw transcript column</text><text x="1210" y="386" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="end">no grant</text><text x="682" y="408" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#e6edf3" text-anchor="start">job queue</text><text x="1210" y="408" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="end">no grant</text><text x="682" y="430" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#e6edf3" text-anchor="start">another tenant's rows</text><text x="1210" y="430" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="end">invisible</text><text x="682" y="452" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#e6edf3" text-anchor="start">ciphertext copied to another row</text><text x="1210" y="452" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16.2" font-weight="400" fill="#9198a1" text-anchor="end">does not decrypt (AAD)</text></svg>
